# TastaturTrainer – Build-Pipeline
#   test     → Syntax, Übersetzungen, Kursinhalte, Datenbereinigung, Browser-Test (Linux, Chrome)
#   build    → Release-ZIP (HTML-Version) und Web-App für GitHub Pages
#   desktop  → TastaturTrainer.exe bauen und selbst testen (Windows)
#   pages    → Web-App auf GitHub Pages veröffentlichen (bei Push auf main)
#   release  → GitHub-Release mit ZIP und EXE (bei einem Tag „v*“, z. B. v1.1.0)
#
# Sicherheit: minimale Rechte (Lesen; Schreiben nur in pages/release), Actions auf Commit-SHA gepinnt
# (Dependabot hält sie aktuell), keine Secrets, keine npm-Abhängigkeiten, NuGet-Pakete per Lock-Datei
# mit Prüfsummen, keine ${{ }}-Ausdrücke direkt in Shell-Befehlen.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Prüfen & Testen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Statische Prüfungen (Syntax, i18n, Kurse, Datenbereinigung, Web-App)
        run: node tools/check.js

      - name: Browser-Test (headless Chrome, beide Sprachen, CSP, XSS, offline)
        run: node tools/e2e.js
        env:
          E2E_SHOTS: e2e-shots

      - name: Screenshots hochladen
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: e2e-shots
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: ZIP & Web-App bauen
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Version und Zeitstempel bestimmen
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Ungültiger Tag: $GITHUB_REF_NAME"; exit 1; }
            echo "BT_VERSION=$v" >> "$GITHUB_ENV"
          fi
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: ZIP und Web-App bauen
        run: node tools/build.js

      - name: ZIP hochladen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tastaturtrainer-zip
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Web-App für GitHub Pages hochladen
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/site

  desktop:
    name: EXE bauen & testen
    needs: test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Version bestimmen
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Ungültiger Tag: $GITHUB_REF_NAME"; exit 1; }
            echo "BT_VERSION=$v" >> "$GITHUB_ENV"
          fi

      - name: EXE bauen und selbst testen (nur die EXE in einem leeren Ordner)
        run: node tools/build-exe.js --selftest
        env:
          EXE_SELFTEST_DIR: exe-selftest

      # Hier kann später die Code-Signatur eingehängt werden (siehe SIGNING.md).

      - name: EXE hochladen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tastaturtrainer-exe
          path: |
            dist/TastaturTrainer.exe
            dist/TastaturTrainer.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Selbsttest-Ergebnis hochladen
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exe-selftest
          path: exe-selftest
          if-no-files-found: ignore
          retention-days: 7

  pages:
    name: GitHub Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [build, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Pages einrichten
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Veröffentlichen
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  release:
    name: GitHub-Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: ZIP herunterladen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tastaturtrainer-zip
          path: dist

      - name: EXE herunterladen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tastaturtrainer-exe
          path: dist

      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "TastaturTrainer $TAG" --generate-notes
