# BlindTrainer – Build-Pipeline
# Prüft jeden Push/PR (Syntax, Übersetzungen, Kursinhalte, Sicherheits-Tests, Browser-Test)
# und baut ein Release-ZIP. Bei einem Tag „v*“ (z. B. v1.1.0) wird ein GitHub-Release erstellt.
#
# Sicherheit: minimale Rechte (nur Lesen, Schreiben nur im Release-Job), Actions auf Commit-SHA
# gepinnt (Dependabot hält sie aktuell), keine Secrets, keine npm-Abhängigkeiten,
# keine ${{ }}-Ausdrücke direkt in Shell-Befehlen.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Prüfen & Testen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Statische Prüfungen (Syntax, i18n, Kurse, Datenbereinigung)
        run: node tools/check.js

      - name: Browser-Test (headless Chrome, beide Sprachen, CSP, XSS)
        run: node tools/e2e.js
        env:
          E2E_SHOTS: e2e-shots

      - name: Screenshots hochladen
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: e2e-shots
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Paket bauen
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Version und Zeitstempel bestimmen
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Ungültiger Tag: $GITHUB_REF_NAME"; exit 1; }
            echo "BT_VERSION=$v" >> "$GITHUB_ENV"
          fi
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: ZIP bauen
        run: node tools/build.js

      - name: Paket hochladen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blindtrainer
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub-Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Paket herunterladen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: blindtrainer
          path: dist

      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.zip dist/*.sha256 --repo "$GITHUB_REPOSITORY" --title "BlindTrainer $TAG" --generate-notes
